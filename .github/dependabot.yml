version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      # One weekly PR for routine dev-tool updates; runtime dependencies and majors stay separate.
      dev-tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # The AnalyticsPanel is built and locked on recharts 2.x. 3.x is a breaking major with no benefit for this panel.
      - dependency-name: recharts
        versions: ['>=3']
      # The toolchain is pinned to vitest 4; a major upgrade is a deliberate migration, not a bump.
      - dependency-name: vitest
        versions: ['>=5']
      # The toolchain is pinned to TypeScript 6; TypeScript 7 is a deliberate compiler migration.
      - dependency-name: typescript
        versions: ['>=7']
      # Node type definitions track the Node 24 runtime (.nvmrc, engines).
      - dependency-name: '@types/node'
        versions: ['>=25']
      # @react-three/fiber declares peer react ">=19 <19.3" up to and including 9.7.0, its latest.
      # React 19.3 therefore cannot dedupe against the R3F stack: npm installs a second copy and
      # every hook reads a null dispatcher. Revisit when fiber widens the range.
      - dependency-name: react
        versions: ['>=19.3']
      - dependency-name: react-dom
        versions: ['>=19.3']
      - dependency-name: '@types/react'
        versions: ['>=19.3']
      - dependency-name: '@types/react-dom'
        versions: ['>=19.3']
  - package-ecosystem: npm
    directory: /tooling
    schedule:
      interval: weekly
    groups:
      # core/functions/extensions must move together or verify_meshes.mjs reads a split toolchain.
      gltf-transform:
        patterns: ['@gltf-transform/*']
  - package-ecosystem: npm
    directory: /tooling/video
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tooling
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
